<title>Outreach Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: sticky top bar + tabs, one working surface per tab (Today, Pipeline, Accounts, Log, Scorecard). Drawer slides over for one contact. */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --surface-2:#E8EDF1; --line:#D3DAE1; --fg:#142029; --muted:#586878;
  --accent:#0B6E69; --accent-fg:#FFFFFF; --accent-soft:#D8EFEC;
  --due:#9A4A06; --due-bg:#FCEBD3; --ok:#17703F; --ok-bg:#D9F1E3; --bad:#B0281C; --bad-bg:#FADFDB;
  --seg-a:#2557C8; --seg-a-bg:#DCE6FB; --seg-c:#8A4B00; --seg-c-bg:#F7E4C6; --seg-w:#17703F; --seg-w-bg:#D9F1E3;
  --shadow:0 1px 2px rgba(20,32,41,.06),0 6px 18px rgba(20,32,41,.07);
  --font-display:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E151B; --surface:#161F27; --surface-2:#1E2933; --line:#2A3743; --fg:#E7EDF2; --muted:#94A5B4;
  --accent:#4CC2B8; --accent-fg:#04201D; --accent-soft:#12312F;
  --due:#F1B766; --due-bg:#3A2A12; --ok:#5ED093; --ok-bg:#12321F; --bad:#F28E85; --bad-bg:#3B1B18;
  --seg-a:#8FB0FF; --seg-a-bg:#1A2B52; --seg-c:#F0B866; --seg-c-bg:#3A2A12; --seg-w:#5ED093; --seg-w-bg:#12321F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#161F27; --surface-2:#1E2933; --line:#2A3743; --fg:#E7EDF2; --muted:#94A5B4;
  --accent:#4CC2B8; --accent-fg:#04201D; --accent-soft:#12312F;
  --due:#F1B766; --due-bg:#3A2A12; --ok:#5ED093; --ok-bg:#12321F; --bad:#F28E85; --bad-bg:#3B1B18;
  --seg-a:#8FB0FF; --seg-a-bg:#1A2B52; --seg-c:#F0B866; --seg-c-bg:#3A2A12; --seg-w:#5ED093; --seg-w-bg:#12321F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.wrap{max-width:1180px;margin-inline:auto}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:14px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:20px}
.brand .date{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.pill b{font-family:var(--font-mono);font-weight:500}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.g{background:var(--ok)}.dot.y{background:var(--due)}.dot.r{background:var(--bad)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:9px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--font-mono);font-size:11px;background:var(--surface-2);border-radius:999px;padding:1px 7px;margin-left:6px;color:var(--muted)}
main{padding-top:18px;display:grid;gap:18px}
/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font-size:15px;margin-bottom:10px}
.sub{color:var(--muted);font-size:13px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 11px;font-weight:500;font-size:13px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;font-weight:600;text-align:left;color:var(--fg)}
.link:hover{text-decoration:underline}
a.ext{color:var(--accent);text-decoration:none;font-weight:500}a.ext:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 7px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.seg-A{background:var(--seg-a-bg);color:var(--seg-a)}.chip.seg-C{background:var(--seg-c-bg);color:var(--seg-c)}.chip.seg-W{background:var(--seg-w-bg);color:var(--seg-w)}
.chip.due{background:var(--due-bg);color:var(--due)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.mono{font-family:var(--font-mono);font-weight:500}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.fbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px}
textarea{min-height:72px;resize:vertical}
label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--font-display);font-size:16px;margin-bottom:4px}
/* today */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:stretch}
@media (max-width:780px){.hero{grid-template-columns:1fr}}
.big{font-family:var(--font-mono);font-size:44px;font-weight:500;line-height:1;letter-spacing:-.03em}
.big small{font-size:20px;color:var(--muted);font-weight:400}
.meter{position:relative;height:12px;background:var(--surface-2);border-radius:99px;margin:14px 0 8px;overflow:visible}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent);max-width:100%}
.meter s{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.55}
.meter span{position:absolute;top:16px;font-size:11px;color:var(--muted);transform:translateX(-50%);font-family:var(--font-mono);white-space:nowrap}
.streams{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.coach{border-left:3px solid var(--due);background:var(--due-bg);color:var(--fg);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13.5px}
.coach.ok{border-color:var(--ok);background:var(--ok-bg)}
.agenda{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);align-items:center}
@media (max-width:640px){.arow{grid-template-columns:1fr}}
.arow .who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.arow .meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.arow .next{font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.arow .btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;grid-row:1/span 3;grid-column:2}
@media (max-width:640px){.arow .btns{grid-row:auto;grid-column:auto}}
.grouphead{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 8px}
.grouphead h3{font-size:14px}
.upcoming{display:grid;gap:8px}
.up{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
.up:first-child{border-top:0}
.goalgrid{display:grid;gap:10px}
/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{flex:0 0 232px;background:var(--surface-2);border-radius:10px;padding:8px;min-height:120px}
.col.over{outline:2px dashed var(--accent)}
.col h3{font-size:12.5px;display:flex;justify-content:space-between;padding:2px 4px 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-family:var(--font-body);font-weight:600}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:7px;display:grid;gap:3px;cursor:grab}
.kcard:active{cursor:grabbing}
.kcard .cname{font-weight:600;font-size:13.5px}
.kcard .ccomp{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard .cmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
/* accounts */
.acct{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.acct+.acct{margin-top:8px}
.acct summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.3fr) 90px 90px;gap:10px;align-items:center;padding:11px 14px}
.acct summary::-webkit-details-marker{display:none}
@media (max-width:700px){.acct summary{grid-template-columns:1fr 1fr}}
.acct[open] summary{border-bottom:1px solid var(--line)}
.acct .body{padding:12px 14px;display:grid;gap:10px;font-size:13px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.acct .nm{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* log */
.feed{display:grid;gap:0}
.day{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:14px 0 6px;display:flex;justify-content:space-between}
.ev{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.ev .t{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.ev .what{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ev .note{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.addlog{display:grid;grid-template-columns:140px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.4fr) auto;gap:10px;align-items:end}
@media (max-width:860px){.addlog{grid-template-columns:1fr 1fr}}
/* scorecard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .v{font-family:var(--font-mono);font-size:26px;font-weight:500;letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-size:12.5px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
td.mono{font-family:var(--font-mono)}
.bar-g{fill:var(--ok)}.bar-y{fill:var(--due)}.bar-r{fill:var(--bad)}.bar-n{fill:var(--muted);opacity:.45}.bar-t{fill:var(--accent)}
svg text{fill:var(--muted);font-family:var(--font-mono);font-size:11px}
svg .tl{stroke:var(--fg);stroke-dasharray:5 4;opacity:.6}svg .fl{stroke:var(--due);stroke-dasharray:2 3}
svg .ax{stroke:var(--line)}
.fun{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.fun i{display:block;height:10px;border-radius:99px;background:var(--accent);min-width:3px}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(10,18,24,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100vw);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer header{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.drawer .dbody{overflow:auto;padding:14px 18px 28px;display:grid;gap:18px;padding-right:max(18px,env(safe-area-inset-right,0px))}
.drawer h2{font-size:18px}
.evgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;z-index:42;padding:18px;box-shadow:var(--shadow);display:grid;gap:12px;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:9px;display:flex;gap:14px;align-items:center;font-size:13.5px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast.bad{background:var(--bad);color:#fff}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* linkedin */
.cmp{display:grid;grid-template-columns:minmax(130px,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:10px 16px;align-items:center;font-size:13px}
.cmp .h{color:var(--muted);font-size:12px;font-weight:600}
.pbar{display:flex;align-items:center;gap:8px}
.pbar b{font-family:var(--font-mono);font-weight:500;min-width:40px}
.pbar span{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.pbar.alt i{background:var(--seg-a)}
.tagsel{width:auto;padding:3px 6px;font-size:12.5px}
td.snip{white-space:normal;min-width:220px;max-width:320px;text-align:left}
.sigform{display:grid;grid-template-columns:130px 170px minmax(0,1.2fr) 120px minmax(0,1.2fr) auto;gap:10px;align-items:end}
@media (max-width:980px){.sigform{grid-template-columns:1fr 1fr}}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper b{font-family:var(--font-mono);min-width:22px;text-align:center;font-weight:500;font-size:16px}
svg .mk{fill:var(--accent)}svg .mt{fill:var(--due)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.4}}}
</style>

<div id="root"><div class="wrap" id="app"></div><div id="layer"></div><div id="toast" aria-live="polite"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="demo-backend.js"></script>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var OUTREACH=['Connect request sent','LinkedIn message sent','Email sent','Follow-up sent','Call made'];
var EVENTS=OUTREACH.concat(['Connection accepted','Reply received','Meeting booked','Proposal sent','"No" received']);
var STATUSES=['Target','Connect sent','Connected','Messaged','Emailed','Replied','Meeting','Proposal','Won','Lost','Nurture','Do not contact'];
var CLOSED=['Won','Lost','Do not contact'];
var SEG={A:'Financial services',C:'Retail',W:'Warm network'};
var REASONS=['Not now / bad timing','Already has a provider','No budget','Wrong person or not their area','Other'];
var EMAIL_STATUS=['To find','Public (company site)','Found (tool)','Verified','Bounced','Do not use'];
var S={contacts:[],companies:[],activity:[],daily:{},settings:{daily:10,floor:4,connects:7,meetingsWeek:3,start:'2026-11-11',ltStart:'2026-11-10'},
  li:{summary:null,daily:[],posts:[],audience:null},tags:{},signals:[],confirmSig:null,
  loaded:{},tab:'today',seg:'all',q:'',openId:null,modal:null,openAcct:{},confirmDel:null,noDb:false,slow:false,logSeg:'all',logEv:'all',accSeg:'all',accTier:'all',pending:false};
var db=null,dl=null,toastTimer=null,queues={};

/* ---------- dates ---------- */
function pad(n){return String(n).padStart(2,'0')}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function today(){return window.__today||fmt(new Date())}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function bizDate(s,n){var r=addDays(s,n),w=parse(r).getDay();if(w===6)r=addDays(r,2);else if(w===0)r=addDays(r,1);return r}
function isBiz(s){var w=parse(s).getDay();return w!==0&&w!==6}
function weekStart(s){return addDays(s,-((parse(s).getDay()+6)%7))}
function nice(s){return parse(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function short(s){return parse(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function hhmm(ts){var d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())}

/* ---------- data helpers ---------- */
function byId(id){for(var i=0;i<S.contacts.length;i++)if(S.contacts[i].id===id)return S.contacts[i];return null}
function comp(id){for(var i=0;i<S.companies.length;i++)if(S.companies[i].id===id)return S.companies[i];return null}
function safeLi(u){return /^https:\/\/([a-z0-9-]+\.)?linkedin\.com\//i.test(u||'')?u:''}
function safeUrl(u){return /^https?:\/\//i.test(u||'')?u:''}
function liSearch(c){return 'https://www.linkedin.com/search/results/people/?keywords='+encodeURIComponent(c.name+' '+(c.companyName||'').replace(/\(.*?\)/g,''))}
function buildCounts(){var m={};S.activity.forEach(function(a){(m[a.date]=m[a.date]||{})[a.event]=((m[a.date]||{})[a.event]||0)+1});S.counts=m}
function outreachOf(m){var n=0;OUTREACH.forEach(function(e){n+=(m&&m[e])||0});return n}
function dayN(d){return outreachOf(S.counts[d])}
function dayState(d,n){var T=today();if(d>T)return 'n';n=n==null?dayN(d):n;if(n>=S.settings.daily)return 'g';if(n>=S.settings.floor)return 'y';return d===T?'t':'r'}
function isClosed(c){return CLOSED.indexOf(c.status)>-1}
function primaryEvent(c){
  switch(c.status){
    case 'Target':return (c.origin==='Warm'||c.origin==='Intro')?'LinkedIn message sent':'Connect request sent';
    case 'Connect sent':return 'Connection accepted';
    case 'Connected':return 'LinkedIn message sent';
    case 'Messaged':case 'Emailed':case 'Proposal':return 'Follow-up sent';
    case 'Replied':return 'Meeting booked';
    case 'Meeting':return 'Proposal sent';
    case 'Nurture':return 'LinkedIn message sent';
  }
  return 'Follow-up sent';
}
function evLabel(e){return e==='"No" received'?'Got a "No"':e}
function segChip(s){return '<span class="chip seg-'+esc(s)+'" title="'+esc(SEG[s]||s)+'">'+esc(s)+'</span>'}

/* ---------- writes ---------- */
function qwrite(path,fn){var p=(queues[path]||Promise.resolve()).catch(function(){}).then(fn);queues[path]=p;return p}
function werr(e){toast((e&&e.code==='invalid_argument')?'Could not save. This view may be read-only.':'Could not save. Try again in a moment.','bad')}
function upd(id,f){return qwrite('contacts/'+id,function(){return db.doc('contacts/'+id).update(f)})}
function transition(c,ev,date,x){
  var u={lastTouch:date},s;
  switch(ev){
    case 'Connect request sent':Object.assign(u,{status:'Connect sent',connectDate:date,step:0,nextAction:'Check if accepted; message them if yes',nextDate:bizDate(date,4)});break;
    case 'Connection accepted':Object.assign(u,{status:'Connected',nextAction:'Send first message (about their work, not a pitch)',nextDate:date});break;
    case 'LinkedIn message sent':Object.assign(u,{status:'Messaged',msgDate:date,step:1,nextAction:'Follow-up 1 (a concrete use case)',nextDate:bizDate(date,3)});break;
    case 'Email sent':Object.assign(u,{status:'Emailed',emailDate:date,step:1,nextAction:'Follow-up 1 (a concrete use case)',nextDate:bizDate(date,3)});break;
    case 'Follow-up sent':
      s=(c.step||1)+1;
      if(s===2)Object.assign(u,{step:2,nextAction:'Follow-up 2 (a concrete use case)',nextDate:bizDate(date,4)});
      else if(s===3)Object.assign(u,{step:3,nextAction:'Closing-the-loop message',nextDate:bizDate(date,7)});
      else Object.assign(u,{step:4,status:'Nurture',nextAction:'Revisit: any news or a new use case?',nextDate:bizDate(date,60)});
      break;
    case 'Call made':Object.assign(u,{nextAction:'Log what came out of the call',nextDate:bizDate(date,2)});break;
    case 'Reply received':Object.assign(u,{status:'Replied',replied:'Yes',nextAction:'Answer within 24 h',nextDate:date});break;
    case 'Meeting booked':Object.assign(u,{status:'Meeting',nextAction:'Put the meeting date in notes; prepare 3 discovery questions',nextDate:bizDate(date,1)});break;
    case 'Proposal sent':Object.assign(u,{status:'Proposal',step:1,nextAction:'Proposal follow-up (day 3)',nextDate:bizDate(date,3)});break;
    case '"No" received':Object.assign(u,{status:'Lost',outcome:(x&&x.note)||'',nextAction:'',nextDate:null,replied:'Yes'});break;
  }
  return u;
}
async function logAction(c,ev,x){
  x=x||{};var date=x.date||today(),u=transition(c,ev,date,x),prev={};
  Object.keys(u).forEach(function(k){prev[k]=c[k]===undefined?null:c[k]});
  try{
    var ref=await db.collection('activity').add({date:date,contactId:c.id,contactName:c.name,company:c.companyName||'',seg:c.seg||'',event:ev,note:x.note||'',ts:Date.now()});
    await upd(c.id,u);
    toast(evLabel(ev)+': '+c.name,'ok',async function(){
      try{await db.doc('activity/'+ref.id).delete();await upd(c.id,prev)}catch(e){werr(e)}
    });
  }catch(e){werr(e)}
}
async function setField(id,k,v){try{var o={};o[k]=v;await upd(id,o)}catch(e){werr(e)}}
async function setStatus(id,status){
  var f={status:status};if(CLOSED.indexOf(status)>-1){f.nextDate=null;f.nextAction=''}
  try{await upd(id,f)}catch(e){werr(e)}
}
async function snooze(c){try{await upd(c.id,{nextDate:bizDate(today(),1)});toast('Moved to '+nice(bizDate(today(),1))+': '+c.name,'ok')}catch(e){werr(e)}}
async function saveDaily(k,v){
  var T=today(),cur=Object.assign({},S.daily[T]||{});cur[k]=v;cur.date=T;
  try{await qwrite('daily/'+T,function(){return db.doc('daily/'+T).set(cur)})}catch(e){werr(e)}
}
async function saveSetting(k,v){
  var n=Math.max(0,Math.round(Number(v)||0)),cur=Object.assign({},S.settings);cur[k]=(k==='start'||k==='ltStart')?v:n;
  try{await qwrite('settings/targets',function(){return db.doc('settings/targets').set(cur)})}catch(e){werr(e)}
}
async function delActivity(id){
  var a=S.activity.filter(function(x){return x._id===id})[0];
  try{await db.doc('activity/'+id).delete();toast('Entry removed. The contact keeps its current status.','ok')}catch(e){werr(e)}
}
async function addManual(f){
  var c=byId(f.cid);if(!c)return;
  try{await db.collection('activity').add({date:f.date,contactId:c.id,contactName:c.name,company:c.companyName||'',seg:c.seg||'',event:f.ev,note:f.note||'',ts:Date.now()});
    toast('Added to the log (the contact record is unchanged).','ok')}catch(e){werr(e)}
}
async function addContact(f){
  var max=0;S.contacts.forEach(function(c){var n=parseInt(String(c.id).replace(/\D/g,''),10);if(n>max)max=n});
  var id='P-'+String(max+1).padStart(3,'0'),co=comp(f.companyId);
  var doc={id:id,companyId:f.companyId,companyName:co?co.name:'',seg:co?co.seg:'',name:f.name,title:f.title,role:f.role||'Other',priority:Number(f.priority)||2,li:safeLi(f.li),degree:'',
    email:'',emailStatus:'To find',origin:f.origin,lang:'ES',status:'Target',connectDate:null,msgDate:null,emailDate:null,lastTouch:null,
    nextAction:f.origin==='Cold'?'Send LinkedIn connection request':'Send first message',nextDate:today(),replied:'',notes:f.notes||'',outcome:'',step:0,source:'Added in Outreach Desk',verified:today()};
  try{await db.doc('contacts/'+id).set(doc);S.modal=null;S.openId=id;toast('Added '+f.name,'ok');render()}catch(e){werr(e)}
}

/* ---------- toast ---------- */
function toast(msg,kind,undo){
  var t=$('#toast');clearTimeout(toastTimer);
  t.innerHTML='<div class="toast '+(kind==='bad'?'bad':'')+'"><span>'+esc(msg)+'</span>'+(undo?'<button type="button" data-act="undo">Undo</button>':'')+'</div>';
  S.undo=undo||null;
  toastTimer=setTimeout(function(){t.innerHTML='';S.undo=null},undo?9000:5000);
}

/* ---------- views ---------- */
function shortName(n){return String(n||'').replace(/\s*\(.*?\)\s*/g,' ').replace(/\b(Correduría de Seguros( y Reaseguros)?|Correduría|S\.?L\.?U?\.?|S\.?A\.?U?\.?)\b/gi,'').replace(/\s+/g,' ').trim()||n}
function dueChip(c){
  if(!c.nextDate||isClosed(c))return '';var T=today();
  if(c.nextDate<T)return '<span class="chip bad">overdue '+esc(short(c.nextDate))+'</span>';
  if(c.nextDate===T)return '<span class="chip due">today</span>';
  return '<span class="chip">'+esc(short(c.nextDate))+'</span>';
}

function coachLine(T){
  var s=S.settings,n=dayN(T),days=[],d=addDays(T,-1),guard=0;
  while(guard++<20&&d>=s.start){if(isBiz(d)){if(dayN(d)<s.daily)days.push(d);else break}d=addDays(d,-1)}
  var hour=new Date().getHours();
  if(!isBiz(T))return null;
  if(T<s.start)return {t:'The scorecard starts '+nice(s.start)+'. That day\'s list is ready: '+S.contacts.filter(function(c){return c.nextDate===s.start}).length+' contacts.',ok:true};
  if(n>=s.daily)return {t:'Target hit: '+n+' of '+s.daily+'. Write the 6 p.m. recap and count every "No" as a win.',ok:true};
  if(days.length>=2)return {t:days.length+' working days in a row under target ('+days.slice(0,3).map(function(x){return dayN(x)}).reverse().join(', ')+'). What is the real blocker? Write it in the recap. If today is hard, the floor is '+s.floor+'.'};
  if(n===0&&hour>=14)return {t:'Nothing logged yet today. The floor is '+s.floor+': send the first one now, then decide how far to go.'};
  if(n>0&&n<s.floor)return {t:(s.floor-n)+' more to clear the floor, '+(s.daily-n)+' more to hit target.'};
  if(n>=s.floor)return {t:'Floor cleared. '+(s.daily-n)+' more to hit target.',ok:true};
  return null;
}
function viewToday(){
  var T=today(),st=S.settings,n=dayN(T),pct=Math.min(100,n/Math.max(1,st.daily)*100);
  var due=S.contacts.filter(function(c){return c.nextDate&&c.nextDate<=T&&!isClosed(c)});
  due.sort(function(a,b){return (a.nextDate<T?0:1)-(b.nextDate<T?0:1)||a.priority-b.priority||String(a.id).localeCompare(b.id)});
  var segs=['A','C','W'].map(function(g){var tot=due.filter(function(c){return c.seg===g}).length;
    var done=S.activity.filter(function(a){return a.date===T&&a.seg===g&&OUTREACH.indexOf(a.event)>-1}).length;
    return '<span class="chip seg-'+g+'">'+g+' · '+esc(SEG[g])+': '+done+' sent, '+tot+' due</span>'}).join('');
  var co=coachLine(T);
  var hero='<section class="hero"><div class="card"><h2>Today\'s outreach</h2><div class="big">'+n+' <small>/ '+st.daily+'</small></div>'+
    '<div class="meter" role="img" aria-label="'+n+' of '+st.daily+' outreach actions"><i style="width:'+pct+'%"></i><s style="left:'+(st.floor/Math.max(1,st.daily)*100)+'%"></s><span style="left:'+(st.floor/Math.max(1,st.daily)*100)+'%">floor '+st.floor+'</span><span style="left:100%;transform:translateX(-100%)">target '+st.daily+'</span></div>'+
    '<div class="streams">'+segs+'</div></div>'+
    '<div class="card"><h2>Coach</h2>'+(co?'<div class="coach'+(co.ok?' ok':'')+'">'+esc(co.t)+'</div>':'<p class="sub">Nothing to flag.</p>')+
    '<p class="sub" style="margin-top:10px">Connects per day planned: '+st.connects+' (segment A) plus about 3 for segment C and 1 warm ask.</p></div></section>';
  var agenda;
  if(due.length){
    var groups=['A','C','W'].map(function(g){var l=due.filter(function(c){return c.seg===g});
      if(!l.length)return '';
      return '<div><div class="grouphead"><h3>'+segChip(g)+' '+esc(SEG[g])+'</h3><span class="sub">'+l.length+' due</span></div><ul class="agenda">'+l.map(agendaRow).join('')+'</ul></div>'}).join('');
    var other=due.filter(function(c){return ['A','C','W'].indexOf(c.seg)<0});
    agenda='<section class="card"><h2>Due today ('+due.length+')</h2><div style="display:grid;gap:16px">'+groups+(other.length?'<ul class="agenda">'+other.map(agendaRow).join('')+'</ul>':'')+'</div></section>';
  }else{
    var nxt=S.contacts.filter(function(c){return c.nextDate&&c.nextDate>T&&!isClosed(c)}).map(function(c){return c.nextDate}).sort()[0];
    agenda='<section class="empty"><b>Nothing due today</b>'+(nxt?'Next up: '+esc(nice(nxt))+', '+S.contacts.filter(function(c){return c.nextDate===nxt&&!isClosed(c)}).length+' contacts. Open the Pipeline to work ahead.':'Add the next step to a contact to see it here.')+'</section>';
  }
  var dates={};S.contacts.forEach(function(c){if(c.nextDate&&c.nextDate>T&&!isClosed(c))(dates[c.nextDate]=dates[c.nextDate]||[]).push(c)});
  var ds=Object.keys(dates).sort().slice(0,5);
  var up=ds.length?'<section class="card"><h2>Coming up</h2><div class="upcoming">'+ds.map(function(d){var l=dates[d];
    return '<div class="up"><div><b>'+esc(nice(d))+'</b><div class="sub">'+l.length+' contacts</div></div><div>'+l.slice(0,6).map(function(c){return '<button type="button" class="link" data-act="open" data-id="'+esc(c.id)+'">'+esc(c.name)+'</button>'}).join(' · ')+(l.length>6?' · +'+(l.length-6)+' more':'')+'</div></div>'}).join('')+'</div></section>':'';
  var dd=S.daily[T]||{};
  var goals='<section class="row2"><div class="card"><h2>9 a.m. goals</h2><div class="goalgrid">'+
    '<label>Outreach to send<input type="number" id="d-goal" min="0" data-daily="goalOutreach" value="'+esc(dd.goalOutreach!=null?dd.goalOutreach:st.daily)+'"></label>'+
    '<label>The hard thing I will not avoid<input type="text" id="d-hard" data-daily="hardThing" value="'+esc(dd.hardThing||'')+'" placeholder="e.g. message the CEO of UNOde50"></label></div></div>'+
    '<div class="card"><h2>6 p.m. recap</h2><div class="goalgrid">'+
    '<label>What I avoided, or the real blocker<textarea id="d-block" data-daily="recapBlocker" placeholder="One honest line">'+esc(dd.recapBlocker||'')+'</textarea></label>'+
    '<label>Tomorrow\'s first task<input type="text" id="d-first" data-daily="recapFirst" value="'+esc(dd.recapFirst||'')+'"></label></div></div>'+liTodayCard(dd)+'</section>';
  return hero+agenda+goals+up;
}
function filtered(){
  var q=S.q.trim().toLowerCase();
  return S.contacts.filter(function(c){
    if(S.seg!=='all'&&c.seg!==S.seg)return false;
    if(q&&(c.name+' '+c.title+' '+c.companyName+' '+c.notes).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}

  var test='<div style="margin-top:14px"><h3 style="font-size:14px;margin-bottom:6px">Spanish vs English test</h3><div class="tablewrap"><table><thead><tr><th>Window</th><th>Language</th><th>Posts</th><th>Avg impressions</th><th>Avg engagements</th></tr></thead><tbody>'+statRow('Test window (from '+short(S.settings.ltStart)+')',gt)+statRow('All posts in export',ga)+'</tbody></table></div>'+
    '<div style="display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap"><label style="display:flex;gap:8px;align-items:center;font-weight:500">Test starts <input type="date" data-set="ltStart" value="'+esc(S.settings.ltStart)+'" style="width:auto"></label><span class="sub">Tag each post\'s language and format. Judge after about 3 weeks and more than 3 posts per language. Languages were guessed from the post text: correct any that are wrong.</span></div></div>';
  var posts_='<section class="card"><h2>Posts</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Post</th><th>Lang</th><th>Format</th><th>Topic</th><th>Impr.</th><th>Out of network</th><th>Engag.</th><th>Eng. rate</th><th>Followers</th><th>Profile views</th></tr></thead><tbody>'+prow+'</tbody></table></div>'+test+'</section>';
  /* own activity */
  var days=[],dd=T;for(var k=0;k<14;k++){if(isBiz(dd))days.push(dd);dd=addDays(dd,-1)}
  var act='<section class="card"><h2>Your LinkedIn activity</h2><div class="tablewrap"><table><thead><tr><th>Day</th><th>Posts</th><th>Comments</th><th>Floor</th></tr></thead><tbody>'+days.map(function(x){var r=S.daily[x]||{},p=Number(r.liPosts)||0,c=Number(r.liComments)||0;
    return '<tr><td>'+esc(nice(x))+'</td><td class="mono">'+p+'</td><td class="mono">'+c+'</td><td>'+((p>=1||c>=3)?'<span class="chip ok">met</span>':(x===T?'<span class="chip">open</span>':'<span class="chip bad">missed</span>'))+'</td></tr>'}).join('')+'</tbody></table></div><p class="sub" style="margin:8px 0 0">Count them from the Today tab. Floor: 1 post or 3 meaningful comments a day.</p></section>';
  return imp+kpis+chart+aud+'<div style="display:grid;gap:18px">'+posts_+signalsView()+act+'</div>';
}
function uniq(a){var s={},o=[];a.forEach(function(x){if(!s[x]){s[x]=1;o.push(x)}});return o}
function signalsView(){
  var T=today(),wk=weekStart(T),inb=S.signals.filter(function(g){return g.date>=wk&&(g.type==='Inbound DM'||g.type==='Connection request'||g.type==='Comment on my post'||g.type==='Meeting from LinkedIn')});
  var fit=inb.filter(function(g){return g.fit==='Yes'}).length;
  var rows=S.signals.slice(0,40).map(function(g){var ask=S.confirmSig===g._id;
    return '<div class="ev" style="grid-template-columns:70px minmax(0,1fr) auto"><span class="t">'+esc(short(g.date))+'</span><div><div class="what"><span class="chip'+(g.fit==='Yes'?' ok':'')+'">'+esc(g.type)+'</span>'+(g.who?'<b>'+esc(g.who)+'</b>':'')+(g.fit==='Yes'?'<span class="chip ok">target role</span>':'')+'</div>'+(g.note?'<div class="note">'+esc(g.note)+'</div>':'')+'</div>'+
      '<button type="button" class="btn ghost'+(ask?' danger':'')+'" data-act="'+(ask?'delSig':'askDelSig')+'" data-id="'+esc(g._id)+'">'+(ask?'Confirm remove':'Remove')+'</button></div>'}).join('');
  return '<section class="card"><h2>Inbound signals</h2><p class="sub" style="margin:0 0 10px">The real test of the profile and posts: who writes to you, and who is a buyer. This week: <b class="mono">'+inb.length+'</b> inbound, <b class="mono">'+fit+'</b> from a target role (ops, HR, IT, COO, general manager).</p>'+
    '<div class="sigform"><label>Date<input type="date" id="s-date" value="'+esc(T)+'"></label><label>Type<select id="s-type">'+SIG_TYPES.map(function(t){return '<option>'+esc(t)+'</option>'}).join('')+'</select></label>'+
    '<label>Who or where<input type="text" id="s-who" placeholder="e.g. HR director, retailer"></label><label>Target role?<select id="s-fit"><option>Unsure</option><option>Yes</option><option>No</option></select></label>'+
    '<label>Note<input type="text" id="s-note" placeholder="Optional"></label><button type="button" class="btn primary" data-act="addSig">Add</button></div>'+
    '<div class="feed" style="margin-top:8px">'+(rows||'<div class="empty" style="margin-top:10px"><b>No signals yet</b>Log every DM, connection request from a target role and meeting that came from LinkedIn.</div>')+'</div></section>';
}
/* import a LinkedIn analytics export (.xlsx) */
function parseExport(wb){
  var X=window.XLSX,get=function(name){var k=wb.SheetNames.filter(function(n){return n.toUpperCase().indexOf(name)===0})[0];return k?X.utils.sheet_to_json(wb.Sheets[k],{header:1,raw:false,defval:''}):[]};
  var disc=get('DISCOVERY'),eng=get('ENGAGEMENT'),fol=get('FOLLOWERS'),recent=get('MOST RECENT'),top=get('TOP POSTS'),ad=get('AUDIENCE'),cd=get('CONTENT');
  var range=String((disc[0]||[])[1]||'').split(' - '),folDay={};
  var total=0;fol.forEach(function(r,i){if(i===0)total=num(r[1]);else if(/^\d+\/\d+\/\d{4}$/.test(String(r[0])))folDay[mdyIso(r[0])]=num(r[1])});
  var days=eng.filter(function(r){return /^\d+\/\d+\/\d{4}$/.test(String(r[0]))}).map(function(r){var d=mdyIso(r[0]);return {d:d,imp:num(r[1]),eng:num(r[2]),fol:folDay[d]||0}}).sort(function(a,b){return a.d<b.d?-1:1});
  var by={};
  top.forEach(function(r){if(r[4]&&/^https?:/.test(r[4])){var id=postId(r[4]);by[id]=Object.assign(by[id]||{id:id,url:r[4]},{date:mdyIso(r[5]),imp:num(r[6])})}
    if(r[0]&&/^https?:/.test(r[0])){var i2=postId(r[0]);by[i2]=Object.assign(by[i2]||{id:i2,url:r[0],date:mdyIso(r[1])},{eng:num(r[2])})}});
  recent.forEach(function(r){if(!/^https?:/.test(r[0]))return;var id=postId(r[0]);
    by[id]=Object.assign(by[id]||{id:id,url:r[0]},{date:mdyIso(r[1]),type:r[2],imp:num(r[3]),inNet:num(r[4]),outNet:num(r[5]),reach:num(r[6]),views:num(r[7]),avgWatch:r[9]||'',fol:num(r[10]),viewers:num(r[11]),react:num(r[12]),comm:num(r[13]),repost:num(r[14]),saves:num(r[15]),sends:num(r[16])});
    if(by[id].eng==null)by[id].eng=by[id].react+by[id].comm+by[id].repost+by[id].saves+by[id].sends});
  var items=Object.keys(by).map(function(k){return by[k]}).filter(function(p){return p.id});
  var dem=function(rows){return rows.slice(1).filter(function(r){return r[0]&&r[1]}).map(function(r){var p=String(r[2]),lt=/</.test(p);return {cat:r[0],value:r[1],pct:lt?0.5:num(p),lt:lt}})};
  return {summary:{from:mdyIso(range[0]),to:mdyIso(range[1]),impressions:num((disc[1]||[])[1]),reached:num((disc[2]||[])[1]),followers:total,importedAt:today()},days:days,items:items,audience:{followers:dem(ad),content:dem(cd)}};
}
window.__parseExport=parseExport;
async function importXlsx(file){
  if(!window.XLSX){toast('The spreadsheet reader did not load. Check your connection and try again.','bad');return}
  try{
    var buf=await file.arrayBuffer(),wb=window.XLSX.read(buf,{type:'array'}),r=parseExport(wb);
    if(!r.days.length||!r.summary.from){toast('This does not look like a LinkedIn analytics export.','bad');return}
    await db.doc('linkedin/summary').set(r.summary);
    await db.doc('linkedin/daily').set({days:r.days});
    await db.doc('linkedin/posts').set({items:r.items});
    await db.doc('linkedin/audience').set(r.audience);
    toast('Imported '+r.days.length+' days and '+r.items.length+' posts ('+short(r.summary.from)+' to '+short(r.summary.to)+').','ok');
  }catch(e){toast('Could not read that file.','bad')}
}

    if(m.type==='add'){h+='<div class="scrim" data-act="closeModal"></div><div class="modal" role="dialog" aria-label="Add contact"><h2 style="font-size:16px">Add a contact</h2><div class="fgrid">'+

/* ---------- render loop ---------- */
function render(){
  var ae=document.activeElement;
  if(ae&&ae!==document.body&&ae.matches&&ae.matches('input,textarea,select')&&$('#root').contains(ae)){S.pending=true;return}
  S.pending=false;buildCounts();
  var bd=$('.board'),sl=bd?bd.scrollLeft:0,sy=window.scrollY;
  $('#app').innerHTML=shell();
  var nb=$('.board');if(nb)nb.scrollLeft=sl;
  renderLayer();
}
var raf=0;function sched(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;render()})}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.getAttribute('data-act'),id=t.getAttribute('data-id'),c=id?byId(id):null;
  switch(act){
    case 'tab':S.tab=t.getAttribute('data-v');try{history.replaceState(null,'','#'+S.tab)}catch(x){}render();break;
    case 'seg':S.seg=t.getAttribute('data-v');render();break;
    case 'accSeg':S.accSeg=t.getAttribute('data-v');render();break;
    case 'accTier':S.accTier=t.getAttribute('data-v');render();break;
    case 'logSeg':S.logSeg=t.getAttribute('data-v');render();break;
    case 'open':if(c){S.openId=id;render();var cb=$('#closeBtn');if(cb)cb.focus()}break;
    case 'close':S.openId=null;render();break;
    case 'closeModal':S.modal=null;render();break;
    case 'ev':if(c)logAction(c,t.getAttribute('data-ev'));break;
    case 'no':if(c){S.modal={type:'no',id:id};render()}break;
    case 'noReason':if(S.modal&&byId(S.modal.id)){var mc=byId(S.modal.id);S.modal=null;render();logAction(mc,'"No" received',{note:t.getAttribute('data-r')})}break;
    case 'snooze':if(c)snooze(c);break;
    case 'undo':if(S.undo){var f=S.undo;S.undo=null;$('#toast').innerHTML='';f()}break;
    case 'addC':S.modal={type:'add'};render();break;
    case 'saveC':{var nm=$('#a-name').value.trim();if(!nm){toast('Add a name first.','bad');break}
      addContact({name:nm,title:$('#a-title').value.trim(),companyId:$('#a-co').value,priority:$('#a-pr').value,origin:$('#a-or').value,li:$('#a-li').value.trim(),notes:$('#a-no').value.trim()});break}
    case 'addLog':{var dd=$('#l-date').value,cid=$('#l-c').value,ev=$('#l-e').value;if(!dd||!cid){toast('Pick a date and a contact.','bad');break}
      addManual({date:dd,cid:cid,ev:ev,note:$('#l-n').value.trim()});$('#l-n').value='';break}
    case 'askDel':S.confirmDel=id;render();break;
    case 'delAct':S.confirmDel=null;delActivity(id);break;
    case 'export':exportCsv();break;
    case 'liInc':liInc(t.getAttribute('data-k'),Number(t.getAttribute('data-d')));break;
    case 'addSig':{var sd=$('#s-date').value,sw=$('#s-who').value.trim(),sn=$('#s-note').value.trim();if(!sd){toast('Pick a date.','bad');break}
      addSignal({date:sd,type:$('#s-type').value,who:sw,fit:$('#s-fit').value,note:sn});$('#s-who').value='';$('#s-note').value='';break}
    case 'askDelSig':S.confirmSig=id;render();break;
    case 'delSig':S.confirmSig=null;delSignal(id);break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.hasAttribute('data-f')&&S.openId){var k=t.getAttribute('data-f'),v=t.value;
    if(k==='status')setStatus(S.openId,v);else if(k==='li'){setField(S.openId,k,safeLi(v.trim())||v.trim())}

  else if(t.hasAttribute('data-daily'))saveDaily(t.getAttribute('data-daily'),t.type==='number'?Number(t.value):t.value);

window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(['today','pipeline','accounts','log','scorecard','linkedin'].indexOf(h)>-1){S.tab=h;render()}});

async function exportCsv(){
  if(!S.dl)return;
  var cols=['id','companyName','seg','name','title','role','priority','li','degree','email','emailStatus','origin','status','connectDate','msgDate','emailDate','nextAction','nextDate','replied','notes','outcome'];
  var q=function(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var csv=cols.join(',')+'\n'+S.contacts.map(function(c){return cols.map(function(k){return q(c[k])}).join(',')}).join('\n');
  try{await S.dl.save({filename:'outreach-desk-contacts-'+today()+'.csv',data:csv})}catch(e){if(e&&e.code!=='declined')toast('Could not save the file here.','bad')}
}

/* ---------- boot ---------- */
function fail(){S.slow=true;sched()}
function ready(k){S.loaded[k]=true;sched()}
async function boot(){
  var h=location.hash.slice(1);if(['today','pipeline','accounts','log','scorecard','linkedin'].indexOf(h)>-1)S.tab=h;
  render();
  var timer=setTimeout(function(){if(!S.loaded.contacts){S.slow=true;sched()}},10000);
  try{db=window.host&&await window.host.use('db')}catch(e){db=null}
  if(!db){clearTimeout(timer);S.noDb=true;sched();return}
  try{S.dl=await window.host.use('downloads')}catch(e){S.dl=null}
  db.collection('contacts').onSnapshot(function(snap){S.contacts=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});clearTimeout(timer);ready('contacts')},fail);
  db.collection('activity').orderBy('ts','desc').limit(1000).onSnapshot(function(snap){S.activity=snap.docs.map(function(d){return Object.assign({},d.data(),{_id:d.id})});ready('activity')},fail);
  db.doc('companies/all').onSnapshot(function(s){S.companies=s.exists?((s.data()||{}).items||[]):[];ready('companies')},fail);
  db.doc('settings/targets').onSnapshot(function(s){if(s.exists)S.settings=Object.assign({},S.settings,s.data());ready('settings')},fail);
  db.collection('daily').onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=d.data()});S.daily=m;ready('daily')},fail);
  db.doc('linkedin/summary').onSnapshot(function(s){S.li.summary=s.exists?s.data():null;sched()},fail);
  db.doc('linkedin/daily').onSnapshot(function(s){S.li.daily=s.exists?((s.data()||{}).days||[]):[];sched()},fail);
  db.doc('linkedin/posts').onSnapshot(function(s){S.li.posts=s.exists?((s.data()||{}).items||[]):[];sched()},fail);
  db.doc('linkedin/audience').onSnapshot(function(s){S.li.audience=s.exists?s.data():null;sched()},fail);
  db.collection('postTags').onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=d.data()});S.tags=m;sched()},fail);
  db.collection('signals').orderBy('ts','desc').limit(300).onSnapshot(function(snap){S.signals=snap.docs.map(function(d){return Object.assign({},d.data(),{_id:d.id})});sched()},fail);
}
boot();
})();
